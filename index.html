<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063d2e">
<title>RD Cup 2026 · North Sumatera</title>
<meta property="og:title" content="RD Cup 2026 · North Sumatera">
<meta property="og:description" content="Jadwal, bagan, skor live & pemenang RD Cup 2026">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>(function(){var p;try{p=localStorage.getItem('RD_THEME')}catch(e){}var d=new Date(),h=d.getHours()+d.getMinutes()/60;document.documentElement.dataset.theme=(p==='light'||p==='dark')?p:((h>=5.5&&h<18)?'light':'dark');})()</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="demo" class="demo" hidden>MODE DEMO — data contoh, belum terhubung ke Google Sheets</div>
<button class="thbtn" id="thbtn" onclick="RC.cycleTheme()"></button>
<main class="wrap" id="page"><div class="empty" style="margin-top:80px">⏳ Memuat data RD Cup…</div></main>

<div class="sheet" id="sheet"><div class="topbar"><span class="back" onclick="closeSheet()">‹</span><h2 id="shTitle"></h2></div><div class="wrap" id="shBody"></div></div>

<nav class="bn"><div class="in">
  <a data-p="home" class="on"><i>🏠</i>Beranda</a>
  <a data-p="jadwal"><i>📅</i>Jadwal</a>
  <a data-p="lomba"><i>🏆</i>Lomba</a>
  <a data-p="golf"><i>⛳</i>Golf</a>
  <a data-p="cari"><i>🔎</i>Cari Nama</a>
</div></nav>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const {esc, $} = RC;
let D = null, PAGE = 'home', DAY = null, GK = 'Putra', Q = '', OPEN = null;
const ICON = {'Golf':'⛳','Tenis Lapangan':'🎾','Tenis Meja':'🏓','Gaplek':'🁫','Karaoke':'🎤','Anak':'🧸'};
const TROPHY = `<svg class="trophy" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f5d77a"/><stop offset="1" stop-color="#b8861f"/></linearGradient></defs><path fill="url(#g)" d="M18 6h28v6h10v6c0 8-6 13-12 14-2 5-6 8-9 9v7h8v6H21v-6h8v-7c-3-1-7-4-9-9C14 31 8 26 8 18v-6h10V6zm-6 10v2c0 5 3 8 7 9-1-3-1-6-1-11h-6zm40 0h-6c0 5 0 8-1 11 4-1 7-4 7-9v-2z"/><rect x="19" y="55" width="26" height="5" rx="1.5" fill="url(#g)"/></svg>`;

/* ---------- data ---------- */
async function refresh(silent){
  try { D = await RC.load(); render(); }
  catch(e){
    const c = RC.cached();
    if(c && !D){ D=c; render(); }
    if(!D){ showError(); return; }
    if(!silent) RC.toast('Koneksi lemah — menampilkan data terakhir', true);
  }
}
function showError(){
  $('#page').innerHTML = `<div class="card" style="text-align:center;margin-top:40px;padding:26px 18px"><div style="font-size:42px">📶</div><h2 class="gold" style="font-size:26px;margin:6px 0">Gagal Memuat Data</h2><p class="mut sm" style="margin-bottom:16px">Periksa koneksi internet Anda, lalu coba lagi.</p><button class="btn" onclick="this.disabled=true;this.textContent='Memuat…';refresh()">🔄 Coba Lagi</button></div>`;
}
function cab(k){ return (D.Cabang||[]).find(c=>c.Kode===k); }
function liveMatches(){ return (D.Pertandingan||[]).filter(m=>m.Status==='Berlangsung').concat((D.Grup_Laga||[]).filter(m=>m.Status==='Berlangsung').map(m=>Object.assign({},m,{Lapangan:['Grup '+m.Grup,m.Meja].filter(Boolean).join(' · ')}))); }
function cabStatus(c){
  if(c.Tipe==='BAGAN'){ const ms=RC.matchesOf(D,c.Kode), gl=RC.grupLaga(D,c.Kode); if(ms.some(m=>m.Status==='Berlangsung')||gl.some(m=>m.Status==='Berlangsung')) return 'live';
    if(!RC.winners(D,c).length&&gl.some(m=>m.Status==='Selesai')) return 'live';
    if(RC.winners(D,c).length) return 'done'; if(ms.some(m=>m.Status==='Selesai'&&m['Tim A']!=='BYE'&&m['Tim B']!=='BYE')) return 'live'; return ''; }
  if(c.Tipe==='GOLF'){ const b=RC.golfBoard(D,/putri/i.test(c.Nama)?'Putri':'Putra'); if(!b.length||!b.some(x=>x.thru)) return ''; return b.every(x=>x.done)?'done':'live'; }
  if(RC.winners(D,c).length) return 'done';
  return '';
}
const pill = s => s==='live'?'<span class="pill live">● Live</span>':s==='done'?'<span class="pill done">Selesai</span>':'';

/* ---------- pages ---------- */
function render(){
  $('#demo').hidden = !RC.DEMO;
  document.querySelectorAll('nav.bn a').forEach(a=>a.classList.toggle('on',a.dataset.p===PAGE));
  const f = {home,jadwal,lomba,golf,cari}[PAGE];
  $('#page').innerHTML = f() + `<div class="upd">Diperbarui ${esc(D._time||'')} · otomatis tiap 30 detik · <a class="gold" style="cursor:pointer;text-decoration:underline" onclick="refresh().then(()=>RC.toast('✅ Data terbaru'))">🔄 Muat ulang</a></div>`;
  if(PAGE==='cari'){ const i=$('#q'); i.value=Q; i.focus(); i.setSelectionRange(Q.length,Q.length); }
  if(OPEN) openCab(OPEN, true);
}

function home(){
  const nm = RC.setting(D,'Nama_Event','RD CUP 2026'), sub = RC.setting(D,'Sub_Judul','North Sumatera');
  let h = `<section class="hero">${TROPHY}<h1>${esc(nm)}</h1><div class="sub">${esc(sub)}</div><div class="tag">${esc(RC.setting(D,'Tagline'))}</div><div class="cd" id="cd"></div><button class="btn ghost" style="margin-top:16px;padding:9px 16px;font-size:13px" onclick="shareWA()">📲 Bagikan via WhatsApp</button></section>`;
  const live = liveMatches();
  const nowJ = jadwalNow();
  if(live.length || nowJ.length){
    h += `<div class="sec-title">🔴 Sedang Berlangsung</div><div class="card">`;
    nowJ.forEach(j=> h+= `<div class="row"><div class="time">${esc(j.Mulai)}</div><div class="grow"><div class="b">${esc(j.Acara)}</div><div class="sm mut">📍 ${esc(j.Lokasi)}</div></div><span class="pill live">Live</span></div>`);
    live.forEach(m=>{ const c=cab(m['Kode Cabang'])||{}; h+= `<div class="row click" onclick="openCab('${esc(m['Kode Cabang'])}')"><div class="grow"><div class="sm gold">${esc(c.Nama||m['Kode Cabang'])}${m.Lapangan?' · '+esc(m.Lapangan):''}</div><div class="b">${esc(RC.disp(D,m['Kode Cabang'],m['Tim A']))} <span class="gold">${esc(m['Skor A'])} – ${esc(m['Skor B'])}</span> ${esc(RC.disp(D,m['Kode Cabang'],m['Tim B']))}</div></div><span class="chev">›</span></div>`; });
    h += `</div>`;
  }
  const P = (D.Pengumuman||[]).slice().reverse();
  if(P.length){ h += `<div class="sec-title">📢 Pengumuman</div>`; P.slice(0,4).forEach(p=> h+= infoCard(p)); if(P.length>4) h+=`<button class="btn ghost wide" style="margin-bottom:12px" onclick="openCab('__INFO')">📢 Lihat semua pengumuman (${P.length})</button>`; }
  const W = (D.Cabang||[]).map(c=>({c,w:RC.winners(D,c)})).filter(x=>x.w.length);
  if(W.length){ h += `<div class="sec-title">🏆 Para Juara</div>`; W.forEach(x=> h+= `<div class="card click" onclick="openCab('${esc(x.c.Kode)}')"><div class="b gold">${ICON[x.c.Kategori]||'🏅'} ${esc(x.c.Nama)}</div>${podium(x.w)}</div>`); }
  h += `<div class="sec-title">📍 Lokasi</div><div class="card">` + (D.Lokasi||[]).map(l=>`<div class="row"><div class="grow"><div class="b">${esc(l.Nama)}</div><div class="sm mut">${esc(l.Keterangan)}</div></div>${l['Link Maps']?`<a class="btn ghost" href="${esc(l['Link Maps'])}" target="_blank">🗺️ Maps</a>`:''}</div>`).join('') + `</div>`;
  if((D.Panitia||[]).length) h += `<button class="btn ghost wide" style="margin-top:14px" onclick="openCab('__PANITIA')">🧑‍💼 Lihat Susunan Panitia</button>`;
  const RP=RC.participants(D);
  if(RP.adults.length||RP.anak.length) h += `<div class="card click" style="margin-top:12px;border-color:var(--gold2)" onclick="openCab('__PESERTA')"><div class="b gold">👥 Peserta Terdaftar</div><div style="display:flex;gap:8px;margin:10px 0"><div class="pv" style="flex:1;text-align:center;margin:0"><div class="bebas gold" style="font-size:30px;line-height:1">${RP.adults.length}</div><div class="sm mut">orang dewasa</div></div><div class="pv" style="flex:1;text-align:center;margin:0"><div class="bebas gold" style="font-size:30px;line-height:1">${RP.anak.length}</div><div class="sm mut">anak</div></div></div><div class="sm mut">dari ${RP.ous.filter(o=>o.ou!=='-').length} OU · ${RP.cabs.length} cabang/kategori</div><div class="btn wide" style="margin-top:10px">Lihat daftar peserta ›</div></div>`;
  const pn = (D.Panitia||[]).filter(p=>p['No WA']);
  if(pn.length){ h += `<div class="sec-title">📞 Kontak Panitia</div><div class="card">` + pn.map(p=>`<div class="row"><div class="grow"><div class="b">${esc(p.Nama)}</div><div class="sm mut">${esc(p.Jabatan)}</div></div><a class="btn ghost" target="_blank" href="https://wa.me/${esc(waNo(p['No WA']))}">💬 WA</a></div>`).join('') + `</div>`; }
  setTimeout(tick,0);
  return h;
}
function shareWA(){
  const nm=RC.setting(D,'Nama_Event','RD CUP 2026')+' '+RC.setting(D,'Sub_Judul','North Sumatera');
  const url=location.origin+location.pathname.replace(/index\.html$/,'');
  const msg=`🏆 *${nm}*\n20–22 November 2026\n\nCek jadwal, bagan, skor live & pemenang di sini:\n${url}`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
function waNo(n){ n=String(n).replace(/\D/g,''); return n.startsWith('0')?'62'+n.slice(1):n; }
function jadwalNow(){
  const now=new Date();
  return (D.Jadwal||[]).filter(j=>{ const s=RC.parseDate(j.Tanggal+' '+j.Mulai); if(!s) return false;
    let e=RC.parseDate(j.Tanggal+' '+j.Selesai); if(!e) e=new Date(s.getTime()+4*3600e3); return now>=s && now<=e; });
}
function tick(){
  const el=$('#cd'); if(!el) return;
  const t=RC.parseDate(RC.setting(D,'Mulai_Acara','2026-11-20 13:30')); const diff=t-new Date();
  if(diff<=0){ const end=new Date(t.getTime()+3*864e5); el.innerHTML = new Date()<end?'<span class="pill live" style="font-size:13px;padding:6px 14px">● Sedang Berlangsung</span>':'<span class="pill gold" style="font-size:13px;padding:6px 14px">Terima kasih atas partisipasinya</span>'; return; }
  const d=Math.floor(diff/864e5), hh=Math.floor(diff%864e5/36e5), mm=Math.floor(diff%36e5/6e4), ss=Math.floor(diff%6e4/1e3);
  el.innerHTML=[[d,'Hari'],[hh,'Jam'],[mm,'Menit'],[ss,'Detik']].map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('');
}
setInterval(tick,1000);

function podium(groups){
  return groups.map(g=>(g.judul?`<div class="sm mut" style="margin-top:6px">${esc(g.judul)}</div>`:'')+g.list.map(x=>`<div class="pod"><div class="medal r${esc(x.juara)}">${esc(x.juara)}</div><div class="grow"><div class="b">${esc(x.nama)}</div><div class="sm mut">${esc([x.ou,x.pemain,x.ket].filter(Boolean).join(' · '))}</div></div></div>`).join('')).join('');
}

function jadwal(){
  const days=[...new Set((D.Jadwal||[]).map(j=>j.Tanggal))].sort();
  if(!DAY||!days.includes(DAY)){ const today=new Date().toISOString().slice(0,10); DAY=days.includes(today)?today:days[0]; }
  let h=`<div class="sec-title">📅 Jadwal Acara</div><div class="chips">`+days.map(d=>`<span class="chip ${d===DAY?'on':''}" onclick="DAY='${d}';render()">${esc(RC.fmtTgl(d).replace(/ \d{4}$/,''))}</span>`).join('')+`</div><div class="card">`;
  const nowJ=jadwalNow();
  const L=(D.Jadwal||[]).filter(j=>j.Tanggal===DAY).sort((a,b)=>a.Mulai.localeCompare(b.Mulai));
  h+= L.map(j=>{ const codes=String(j['Kode Cabang']||'').split(',').map(s=>s.trim()).filter(Boolean); const isLive=nowJ.includes(j);
    return `<div class="row ${codes.length?'click':''}" ${codes.length?`onclick="openCab('${esc(codes[0])}')"`:''}><div class="time">${esc(j.Mulai)}<small>${esc(j.Selesai)}</small></div><div class="grow"><div class="b">${esc(j.Acara)}</div><div class="sm mut">📍 ${esc(j.Lokasi)}${j.Keterangan?' · '+esc(j.Keterangan):''}</div>${codes.length>1?`<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap">${codes.map(c=>`<span class="pill" onclick="event.stopPropagation();openCab('${esc(c)}')">${esc((cab(c)||{}).Nama||c)}</span>`).join('')}</div>`:''}</div>${isLive?'<span class="pill live">Live</span>':''}${codes.length?'<span class="chev">›</span>':''}</div>`; }).join('') || '<div class="empty">Belum ada jadwal</div>';
  return h+`</div>`;
}

function lomba(){
  return `<div class="sec-title">🏆 Cabang Lomba</div><div class="grid">`+(D.Cabang||[]).map(c=>`<div class="tile" onclick="openCab('${esc(c.Kode)}')">${pill(cabStatus(c))}<div class="ic">${ICON[c.Kategori]||'🏅'}</div><div class="n">${esc(c.Nama)}</div><div class="l">📍 ${esc(c.Lokasi)} · ${esc(c.Sistem)}</div></div>`).join('')+`</div>`;
}

function golfTable(kat, compact){
  const b=RC.golfBoard(D,kat), pars=RC.pars(D), H=RC.golfHoles(D,kat), n=H.length;
  if(!b.length) return '<div class="empty">Belum ada data pemain</div>';
  return `<div class="sm gold b" style="margin-bottom:6px">${n} hole · Hole ${H[0]+1}–${H[n-1]+1}</div><table><tr><th class="n">#</th><th>Pemain</th><th class="n">Thru</th><th class="n">Gross</th><th class="n">HCP</th><th class="n">Nett</th></tr>`+
  b.map((x,i)=>`<tr class="click" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><td class="n">${x.done?`<span class="rank ${x.rank<=3?'r'+x.rank:''}">${x.rank}</span>`:'–'}</td><td><div class="b">${esc(x.nama)}</div><div class="sm mut">${esc(x.ou)}${x.birdie?` · 🐦 ${x.birdie} birdie`:''}</div></td><td class="n">${x.done?'F':x.thru||'–'}</td><td class="n">${x.thru?x.gross:'–'}</td><td class="n">${x.done?x.hcp:'–'}</td><td class="n b gold">${x.done?x.nett:'–'}</td></tr>
  <tr hidden><td colspan="6">${scoreGrid(x,pars)}</td></tr>`).join('')+`</table><div class="sm mut" style="margin-top:8px">S36 ${n} hole: Par/lebih baik = 2 poin, Bogey = 1, Double bogey+ = 0. HCP = ${2*n} − poin. Nett = Gross − HCP. Ketuk nama untuk lihat scorecard.</div>`;
}
function scoreGrid(x,pars){
  let g='<div class="golfgrid">'; const H=x.holes;
  for(let k=0;k<H.length;k+=9){ const part=H.slice(k,k+9);
    part.forEach(i=>g+=`<div class="h">${i+1}<div class="p">P${pars[i]}</div></div>`); for(let j=part.length;j<9;j++) g+='<div></div>';
    part.forEach(i=>{ const s=x.sc[i]; g+=`<div class="c ${s&&s<pars[i]?'bd':s&&s>=pars[i]+2?'bg':''}">${s||'·'}</div>`; }); for(let j=part.length;j<9;j++) g+='<div></div>'; }
  return g+'</div>';
}
function sidePrizes(kat){
  const L=(D.Golf_Khusus||[]).filter(k=>!kat||k.Kategori===kat);
  if(!L.length) return '';
  return `<div class="card"><div class="b gold" style="margin-bottom:4px">🎯 Hadiah Khusus ${esc(kat||'')}</div>`+L.map(k=>`<div class="row"><div class="grow"><div class="b">${esc(k.Hadiah)} <span class="mut sm">· Hole ${esc(k.Hole)}</span></div><div class="sm ${k.Nama?'':'mut'}">${k.Nama?esc(k.Nama)+' · '+esc(k.OU)+(k.Keterangan?' · '+esc(k.Keterangan):''):'Belum ditentukan'}</div></div>${k.Nama?'<span class="pill gold">🏅</span>':''}</div>`).join('')+`</div>`;
}
function golf(){
  return `<div class="sec-title">⛳ Golf Leaderboard</div><div class="chips">${['Putra','Putri'].map(k=>`<span class="chip ${k===GK?'on':''}" onclick="GK='${k}';render()">${k}</span>`).join('')}</div><div class="card">${golfTable(GK)}</div>${sidePrizes(GK)}`;
}

function cari(){
  let h=`<div class="sec-title">🔎 Cari Nama Saya</div><div class="search"><input id="q" placeholder="Ketik nama atau OU…" oninput="Q=this.value;renderCari()"></div><div id="res" style="margin-top:12px">${cariRes()}</div>`;
  return h;
}
function renderCari(){ $('#res').innerHTML=cariRes(); }
function cariRes(){
  const q=Q.trim().toLowerCase(); if(q.length<2) return '<div class="empty">Ketik minimal 2 huruf untuk melihat jadwal & pertandingan Anda.</div>';
  const has=s=>String(s||'').toLowerCase().includes(q); const out=[];
  (D.Tim||[]).filter(t=>has(t['Pemain 1'])||has(t['Pemain 2'])||has(t['Nama Tim'])||has(t.OU)).forEach(t=>{
    const c=cab(t['Kode Cabang'])||{}; const ms=RC.matchesOf(D,t['Kode Cabang']).filter(m=>m['Tim A']===t['Nama Tim']||m['Tim B']===t['Nama Tim']);
    const nx=ms.find(m=>m.Status!=='Selesai'); const R=Math.max(0,...RC.matchesOf(D,t['Kode Cabang']).map(m=>+m.Babak));
    const last=ms.filter(m=>m.Status==='Selesai').pop(); let st='';
    if(nx) st=`<span class="pill ${nx.Status==='Berlangsung'?'live':''}">${nx.Status==='Berlangsung'?'● Sedang main':'Berikutnya'}</span> ${esc(RC.roundLabel(+nx.Babak,R))} vs <b>${esc(RC.disp(D,t['Kode Cabang'],nx['Tim A']===t['Nama Tim']?nx['Tim B']:nx['Tim A'])||'menunggu lawan')}</b>${nx.Jam?' · ⏰ '+esc(nx.Jam):''}${nx.Lapangan?' · '+esc(nx.Lapangan):''}`;
    else if(last) st= last.Pemenang===t['Nama Tim']?'<span class="pill gold">🏆 Juara</span>':`<span class="pill">Terhenti di ${esc(RC.roundLabel(+last.Babak,R))}</span>`;
    out.push(`<div class="card click" onclick="openCab('${esc(t['Kode Cabang'])}')"><div class="sm gold">${ICON[c.Kategori]||'🏅'} ${esc(c.Nama||t['Kode Cabang'])}</div><div class="b">${esc(t['Nama Tim'])} <span class="mut sm">· ${esc(t.OU)}</span></div><div class="sm mut">${esc([t['Pemain 1'],t['Pemain 2']].filter(Boolean).join(' / '))}</div><div class="sm" style="margin-top:6px">${st||'<span class="mut">Bagan belum dibuat</span>'}</div>${jadwalOf(t['Kode Cabang'])}</div>`);
  });
  (D.Golf||[]).filter(g=>has(g.Nama)||has(g.OU)).forEach(g=>{ const x=RC.golfBoard(D,g.Kategori).find(y=>y.nama===g.Nama);
    out.push(`<div class="card click" onclick="openCab('${g.Kategori==='Putri'?'GOLF-PI':'GOLF-PA'}')"><div class="sm gold">⛳ Golf ${esc(g.Kategori)}</div><div class="b">${esc(g.Nama)} <span class="mut sm">· ${esc(g.OU)}</span></div><div class="sm">${x&&x.done?`Peringkat <b class="gold">${x.rank}</b> · Nett ${x.nett}`:x&&x.thru?`Thru ${x.thru} · Gross ${x.gross}`:'Belum mulai'}</div>${jadwalOf(g.Kategori==='Putri'?'GOLF-PI':'GOLF-PA')}</div>`); });
  (D.Karaoke||[]).filter(k=>has(k.Nama)||has(k.OU)).forEach(k=> out.push(`<div class="card click" onclick="openCab('KARAOKE')"><div class="sm gold">🎤 Karaoke · ${esc(k.Kategori)}</div><div class="b">${esc(k.Nama)} <span class="mut sm">· ${esc(k.OU)}</span></div><div class="sm">No. tampil <b class="gold">${esc(k.No)}</b> · 🎵 ${esc(k.Lagu)}</div>${jadwalOf('KARAOKE')}</div>`));
  (D.Peserta_Anak||[]).filter(a=>has(a.Nama)||has(a['Anak Dari'])).forEach(a=>{ const jw=anakJuara(a.Nama);
    out.push(`<div class="card click" onclick="openCab('ANAK')"><div class="sm gold">🧸 Lomba Anak · Kelompok ${esc(a['Kelompok Umur'])}</div><div class="b">${esc(a.Nama)} <span class="mut sm">· ${esc(String(a.Umur).replace('.',','))} th · ${esc(a.OU)}</span></div>${a['Anak Dari']?`<div class="sm mut">Anak dari ${esc(a['Anak Dari'])}</div>`:''}${jw.length?`<div class="sm" style="margin-top:4px">${jw.map(x=>`<span class="pill gold">🏆 ${esc(x)}</span>`).join(' ')}</div>`:''}${jadwalOf('ANAK')}</div>`); });
  RC.participants(D).non.filter(n=>has(n.nama)||has(n.ket)).forEach(n=> out.push(`<div class="card" style="border-color:#e0a75a"><div class="sm" style="color:#c27a00;font-weight:700">Non Peserta · ${esc(n.status)}</div><div class="b">${esc(n.nama)} <span class="mut sm">· ${esc(n.ou)}</span></div>${n.ket?`<div class="sm mut">${esc(n.ket)}</div>`:''}</div>`));
  (D.Panitia||[]).filter(p=>has(p.Nama)).forEach(p=> out.push(`<div class="card"><div class="sm gold">🧑‍💼 Panitia · ${esc(p.Seksi)}</div><div class="b">${esc(p.Nama)}</div><div class="sm mut">${esc(p.Jabatan)}</div></div>`));
  return out.join('') || '<div class="empty">Nama tidak ditemukan. Hubungi panitia bila nama Anda belum terdaftar.</div>';
}
function jadwalOf(kode){
  const j=(D.Jadwal||[]).find(x=>String(x['Kode Cabang']).split(',').map(s=>s.trim()).includes(kode));
  return j?`<div class="sm mut" style="margin-top:4px">📅 ${esc(RC.fmtTgl(j.Tanggal))} · ${esc(j.Mulai)} · 📍 ${esc(j.Lokasi)}</div>`:'';
}

/* ---------- cabang detail ---------- */
function infoCard(p){ return `<div class="card"><div class="sm mut">${esc(p.Waktu)}</div><div class="b gold">${esc(p.Judul)}</div><div>${esc(p.Isi).replace(/\n/g,'<br>')}</div></div>`; }
let PS={tab:'cabang',q:'',open:{}};
function pesertaPage(){
  const RK=RC.rekap(D), RP=RK.RP; const multi=RP.adults.filter(p=>p.cab.length>1).length;
  const rr=(l,v,b,sub)=>`<div class="row" style="padding:7px 2px"><div class="grow ${sub?'sm mut':''}" ${sub?'style="padding-left:12px"':''}>${l}</div><div class="${b?'bebas gold':'b'}" style="${b?'font-size:26px;line-height:1':''}">${v}</div></div>`;
  let h=`<div class="card" style="border:2px solid var(--gold2)"><div class="b gold" style="margin-bottom:4px">📊 Rekap Jumlah Orang (untuk konsumsi)</div>`+
    rr('Peserta dewasa',RP.adults.length)+rr('Peserta anak',RP.anak.length)+rr('Panitia (total)',RK.pan.length)+rr('↳ juga sebagai peserta','– '+RK.juga,0,1)+rr('↳ panitia bukan peserta',RK.bukan,0,1)+
    (RK.non?rr('Non peserta',RK.non)+RK.nonList.map(x=>rr('↳ '+esc(x[0]),x[1],0,1)).join(''):'')+
    (RK.tambahan?rr('Tambahan (undangan, pendamping, dll.)',RK.tambahan):'')+rr('<b>TOTAL ORANG</b>',RK.total,1)+
    `<div class="sm mut" style="margin-top:6px">= dewasa + anak + panitia bukan peserta${RK.non?' + non peserta':''}${RK.tambahan?' + tambahan':''}. Orang yang ikut beberapa cabang dihitung 1 kali.</div></div>`;
  h+=`<div class="sm mut" style="margin:0 2px 8px">${multi} peserta ikut lebih dari 1 cabang.</div>`;
  h+=`<div class="chips">${[['cabang','Per Cabang'],['nama','Per Nama'],['ou','Per OU']].map(t=>`<span class="chip ${PS.tab===t[0]?'on':''}" onclick="PS.tab='${t[0]}';openCab('__PESERTA',true)">${t[1]}</span>`).join('')}</div>`;
  if(PS.tab==='nama') h+=`<div class="search" style="margin-bottom:10px"><input id="pq" placeholder="Cari nama / OU…" value="${esc(PS.q)}" oninput="PS.q=this.value;$('#plist').innerHTML=pesertaList()"></div>`;
  return h+`<div id="plist">${pesertaList()}</div><p class="sm mut" style="margin-top:6px">Nama yang ditulis berbeda (mis. singkatan) dihitung sebagai orang berbeda.</p>`;
}
function pesertaList(){
  const RP=RC.participants(D);
  const tg=k=>{ PS.open[k]=!PS.open[k]; };
  if(PS.tab==='cabang') return RP.cabs.map((c,i)=>{ const k='c'+i, op=PS.open[k];
    return `<div class="card" style="padding:10px 12px"><div class="row click" style="padding:4px 2px;border:0" onclick="PS.open['${k}']=!PS.open['${k}'];openCab('__PESERTA',true)"><div class="grow b">${esc(c.cab)}</div><span class="b gold">${c.unit} ${c.tipe==='tim'?(c.single?'orang':'tim'):c.tipe==='anak'?'anak':c.tipe==='penampil'?'penampil':'orang'}</span><span class="chev">${op?'⌄':'›'}</span></div>`+
    (op?c.orang.map(o=>`<div class="row sm" style="padding:6px 2px"><div class="grow">${esc(o.nama)}</div><span class="mut">${esc(o.ou)}</span></div>`).join(''):'')+`</div>`; }).join('');
  if(PS.tab==='ou') return RP.ous.map((o,i)=>{ const k='o'+i, op=PS.open[k];
    return `<div class="card" style="padding:10px 12px"><div class="row click" style="padding:4px 2px;border:0" onclick="PS.open['${k}']=!PS.open['${k}'];openCab('__PESERTA',true)"><div class="grow b">${esc(o.ou)}</div><span class="b gold">${o.dewasa.length}</span><span class="sm mut">dewasa</span>${o.anak.length?`<span class="b gold">${o.anak.length}</span><span class="sm mut">anak</span>`:''}${o.non.length?`<span class="b" style="color:#c27a00">${o.non.length}</span><span class="sm mut">non</span>`:''}<span class="chev">${op?'⌄':'›'}</span></div>`+
    (op?o.dewasa.map(p=>`<div class="row" style="padding:7px 2px;display:block"><div class="b sm">${esc(p.nama)}</div><div style="margin-top:3px">${p.cab.map(x=>`<span class="pill" style="margin:1px 2px 1px 0">${esc(x)}</span>`).join('')}</div></div>`).join('')+o.anak.map(a=>`<div class="row sm" style="padding:6px 2px"><div class="grow">🧸 ${esc(a.Nama)}</div><span class="mut">${esc(a.Umur)} th</span></div>`).join('')+o.non.map(n=>`<div class="row" style="padding:7px 2px;display:block"><div class="b sm">${esc(n.nama)}</div><div style="margin-top:3px"><span class="pill np">${esc(n.status)}</span> <span class="sm mut">${esc(n.ket)}</span></div></div>`).join(''):'')+`</div>`; }).join('');
  const q=PS.q.trim().toLowerCase(); const L=RP.adults.filter(p=>!q||p.nama.toLowerCase().includes(q)||String(p.ou).toLowerCase().includes(q));
  const PN=RC.rekap(D).pan.filter(x=>x.peserta).map(x=>x.peserta);
  return `<div class="card">`+(L.map(p=>`<div class="row" style="padding:7px 2px;display:block"><div class="b">${esc(p.nama)} <span class="sm mut" style="font-weight:400">· ${esc(p.ou)}</span>${PN.includes(p)?' <span class="pill gold">🧑‍💼 Panitia</span>':''}</div><div style="margin-top:3px">${p.cab.map(x=>`<span class="pill" style="margin:1px 2px 1px 0">${esc(x)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">Tidak ditemukan</div>')+`</div>`;
}
function panitiaPage(){
  const L=D.Panitia||[]; const groups=[]; const idx={}; const RK=RC.rekap(D); const isP=n=>RK.pan.some(x=>x.peserta&&RC.sameName(x.nama,n));
  L.forEach(p=>{ const g=p.Seksi||'Lainnya'; if(!(g in idx)){ idx[g]=groups.length; groups.push({g,list:[]}); } groups[idx[g]].list.push(p); });
  const lead=j=>/ketua|koordinator|penasehat|bendahara/i.test(j||'');
  return `<div class="sm mut" style="margin:4px 2px 10px">${RK.pan.length} orang · ${groups.length} seksi · ${RK.juga} juga bertanding (🏅) · ${RK.bukan} bukan peserta</div>`+groups.map(x=>`<div class="card"><div class="b gold" style="font-size:16px;margin-bottom:4px">${esc(x.g)}</div>`+
    x.list.map(p=>`<div class="row" style="padding:7px 2px"><div class="grow"><div class="${lead(p.Jabatan)&&!/^anggota$/i.test(p.Jabatan)?'b':''}">${esc(p.Nama)}${isP(p.Nama)?' <span class="pill">🏅 Peserta</span>':''}</div>${p.Jabatan&&!/^anggota$/i.test(p.Jabatan)?`<div class="sm mut">${esc(p.Jabatan)}</div>`:''}</div>${p['No WA']?`<a class="btn ghost" style="padding:6px 10px;font-size:12px" target="_blank" href="https://wa.me/${esc(waNo(p['No WA']))}">💬</a>`:''}</div>`).join('')+`</div>`).join('');
}
function openCab(k, keep){
  const SP={__PANITIA:['Susunan Panitia',panitiaPage],__PESERTA:['Peserta Terdaftar',pesertaPage],__INFO:['Semua Pengumuman',()=>(D.Pengumuman||[]).slice().reverse().map(infoCard).join('')]};
  if(SP[k]&&keep&&k==='__PESERTA'&&document.activeElement&&document.activeElement.id==='pq'){ $('#plist').innerHTML=pesertaList(); return; }
  if(SP[k]){ OPEN=k; const sh=$('#sheet'), y=keep?sh.scrollTop:0; $('#shTitle').textContent=SP[k][0]; $('#shBody').innerHTML=SP[k][1](); sh.classList.add('open'); sh.scrollTop=y; if(k==='__PESERTA'&&PS.tab==='nama'&&keep){ const i=$('#pq'); if(i&&document.activeElement!==i&&PS.q){} } if(!keep) history.pushState({s:1},''); return; }
  const c=cab(k); if(!c) return; OPEN=k;
  const sh=$('#sheet'), y=keep?sh.scrollTop:0;
  $('#shTitle').textContent=c.Nama;
  let h=`<div class="card"><div class="row"><div class="grow"><div class="sm mut">Lokasi</div><div class="b">📍 ${esc(c.Lokasi)}</div></div><div><div class="sm mut">Sistem</div><div class="b">${esc(c.Sistem)}</div></div></div>${jadwalOf(k)}</div>`;
  if(c.Juknis) h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">📋 Ketentuan</div><pre class="jk">${esc(c.Juknis)}</pre></div>`;
  const W=RC.winners(D,c); if(W.length) h+=`<div class="sec-title">🏆 Juara</div><div class="card">${podium(W)}</div>`;
  if(c.Tipe==='BAGAN'){ if(RC.grupLaga(D,c.Kode).length) h+=grupView(c); h+=bracket(c); }
  if(c.Tipe==='GOLF'){ const kat=/putri/i.test(c.Nama)?'Putri':'Putra'; h+=`<div class="sec-title">Leaderboard</div><div class="card">${golfTable(kat)}</div>${sidePrizes(kat)}`; }
  if(c.Tipe==='KARAOKE') h+=karaoke();
  if(c.Tipe==='ANAK') h+=anak();
  $('#shBody').innerHTML=h; sh.classList.add('open'); sh.scrollTop=y;
  if(!keep) history.pushState({s:1},'');
}
function closeSheet(fromPop){ $('#sheet').classList.remove('open'); OPEN=null; if(!fromPop && history.state&&history.state.s) history.back(); }
window.addEventListener('popstate',()=>{ if(OPEN) closeSheet(true); });


function grupView(c){
  const GT=RC.grupTable(D,c.Kode), KO=RC.grupKO(D,c.Kode), lolos=new Set(KO.slots.filter(Boolean)), ko=RC.matchesOf(D,c.Kode).length;
  let h=`<div class="sec-title">Fase Grup</div><div class="sm mut" style="margin:-4px 2px 8px">${ko?'Tim bertanda ✓ lolos ke babak gugur.':GT.allDone?'Tim bertanda ✓ lolos ke babak gugur (menunggu penetapan panitia).':'Klasemen sementara · ✓ = posisi lolos saat ini.'} Urutan: poin (menang 2, seri 1) → selisih babak → babak menang → pertemuan langsung.</div>`;
  const inKO=new Set(RC.matchesOf(D,c.Kode).filter(m=>m.Babak==='1').flatMap(m=>[m['Tim A'],m['Tim B']]));
  const isQ=n=>ko?inKO.has(n):lolos.has(n);
  GT.groups.forEach(g=>{
    const seri=g.rows.some(r=>r.s);
    h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">Grup ${esc(g.g)}${g.done?' <span class="pill done">Selesai</span>':g.ms.some(m=>m.Status==='Berlangsung')?' <span class="pill live">● Live</span>':''}</div><table><tr><th class="n">#</th><th>Tim</th><th class="n">Main</th><th class="n">M</th>${seri?'<th class="n">S</th>':''}<th class="n">K</th><th class="n">Babak</th><th class="n">Poin</th></tr>`+
      g.rows.map(r=>`<tr><td class="n"><span class="rank ${r.main&&r.rank===1?'r1':''}">${r.rank}</span></td><td><div class="b">${esc(r.nama)}${isQ(r.nama)&&r.main?' <span style="color:var(--ok)">✓</span>':''}</div><div class="sm mut">${esc(r.ou)}</div></td><td class="n">${r.main}</td><td class="n">${r.m}</td>${seri?`<td class="n">${r.s}</td>`:''}<td class="n">${r.k}</td><td class="n">${r.bm}–${r.bk}</td><td class="n b gold">${r.poin}</td></tr>`).join('')+`</table>`+
      `<div style="margin-top:8px">`+g.ms.map(m=>{ const done=m.Status==='Selesai', wa=done&&+m['Skor A']>+m['Skor B'], wb=done&&+m['Skor B']>+m['Skor A'];
        return `<div class="row sm" style="padding:6px 2px"><span class="grow" style="text-align:right;${wa?'font-weight:700':''}">${esc(m['Tim A'])}</span><span class="${m.Status==='Berlangsung'?'':'gold'} b" style="min-width:54px;text-align:center;${m.Status==='Berlangsung'?'color:var(--live)':''}">${m.Status==='Belum'?'<span class="mut" style="font-weight:400">vs</span>':esc(m['Skor A'])+' – '+esc(m['Skor B'])}</span><span class="grow" style="${wb?'font-weight:700':''}">${esc(m['Tim B'])}</span></div><div class="sm mut" style="text-align:center;margin:-4px 0 2px;font-size:10.5px">${esc(['Putaran '+m.Putaran,m.Jam&&'⏰ '+m.Jam,m.Meja].filter(Boolean).join(' · '))}${m.Status==='Berlangsung'?' · <span style="color:var(--live)">● LIVE</span>':''}</div>`; }).join('')+`</div></div>`;
  });
  return h;
}
function bracket(c){
  const ms=RC.matchesOf(D,c.Kode), tm=RC.teamMap(D);
  const teams=(D.Tim||[]).filter(t=>t['Kode Cabang']===c.Kode);
  let h='';
  if(ms.length){
    const R=Math.max(...ms.map(m=>+m.Babak));
    h+=`<div class="sec-title">${RC.grupLaga(D,c.Kode).length?'Babak Gugur':'Bagan Pertandingan'}</div><div class="sm mut" style="margin:-4px 2px 8px">Geser ke samping untuk melihat babak berikutnya →</div><div class="bracket">`;
    for(let r=1;r<=R;r++){
      h+=`<div class="round"><h4>${RC.roundLabel(r,R)}</h4><div class="ms">`+ms.filter(m=>+m.Babak===r).map(m=>{
        const t=(side)=>{ const n=m['Tim '+side]; const bye=n==='BYE'; const win=m.Status==='Selesai'&&m.Pemenang&&m.Pemenang===n; const info=tm[c.Kode+'|'+n];
          const sub=info&&info['Pemain 2']?`<div class="sm mut" style="font-weight:400;font-size:10.5px">${esc(info['Pemain 1'])} / ${esc(info['Pemain 2'])}</div>`:info&&info.OU&&info.OU!==n?`<div class="sm mut" style="font-weight:400;font-size:10.5px">${esc(info.OU)}</div>`:'';
          return `<div class="t ${win?'win':''} ${bye?'bye':''}"><div class="nm">${n?esc(RC.disp(D,c.Kode,n)):'<span class="mut">—</span>'}${sub}</div><div class="sc">${esc(m['Skor '+side])}</div></div>`; };
        const st=m.Status==='Berlangsung'?'<span style="color:var(--live)">● LIVE</span>':m.Status==='Selesai'?'Selesai':'';
        return `<div class="m ${m.Status==='Berlangsung'?'live':''}">${t('A')}${t('B')}<div class="meta"><span>${esc([m.Jam&&'⏰ '+m.Jam,m.Lapangan].filter(Boolean).join(' · '))||'#'+m.No}</span><span>${st}</span></div></div>`;
      }).join('')+`</div></div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="sec-title">Peserta (${teams.length})</div><div class="card">`+(teams.map(t=>`<div class="row"><div class="grow"><div class="b">${esc(t['Nama Tim'])}${t.Grup?` <span class="pill">Grup ${esc(String(t.Grup).toUpperCase())}</span>`:t.Kelas?` <span class="pill">Kelas ${esc(t.Kelas)}</span>`:''}</div><div class="sm mut">${esc([t.OU!==t['Nama Tim']?t.OU:'',t['Pemain 1'],t['Pemain 2']].filter(Boolean).join(' · '))}</div></div></div>`).join('')||'<div class="empty">Peserta belum diumumkan</div>')+`</div>`;
  return h;
}
function karaoke(){
  const b=RC.karaokeBoard(D); const kats=[...new Set(b.map(x=>x.Kategori))];
  if(!b.length) return '<div class="empty">Daftar peserta belum diumumkan</div>';
  return kats.map(k=>{ const L=b.filter(x=>x.Kategori===k); const ranked=L.filter(x=>x.rata!=null).sort((a,b)=>b.rata-a.rata);
    return `<div class="sec-title">🎤 ${esc(k)}</div><div class="card"><table><tr><th class="n">No</th><th>Peserta</th><th class="n">Juri</th><th class="n">Nilai</th></tr>`+L.sort((a,b)=>+a.No-+b.No).map(x=>{ const r=ranked.indexOf(x)+1;
      return `<tr><td class="n"><span class="rank ${r&&r<=3?'r'+r:''}">${esc(x.No)}</span></td><td><div class="b">${esc(x.Nama)}</div><div class="sm mut">${esc(x.OU)} · 🎵 ${esc(x.Lagu)}</div></td><td class="n sm">${x.jml}</td><td class="n b gold">${x.rata!=null?x.rata.toFixed(1):'–'}</td></tr>`; }).join('')+`</table></div>`; }).join('')+`<div class="sm mut">Nilai = rata-rata nilai juri (0–100). Lingkaran emas/perak/perunggu = peringkat sementara.</div>`;
}
function kelSort(a,b){ return (parseFloat(a)||0)-(parseFloat(b)||0); }
function anakJuara(nama){
  const n=String(nama||'').trim().toLowerCase(); const out=[];
  (D.Anak||[]).forEach(a=>['1','2','3'].forEach(j=>{ if(String(a['Juara '+j]||'').trim().toLowerCase()===n) out.push(`Juara ${j} ${a.Lomba}`); }));
  return out;
}
function anak(){
  const P=D.Peserta_Anak||[], L=D.Anak||[]; let h='';
  if(P.length){
    const kel=[...new Set(P.map(p=>p['Kelompok Umur']))].sort(kelSort);
    h+=`<div class="sec-title">🧸 Peserta (${P.length} anak)</div>`;
    h+=kel.map(k=>{ const A=P.filter(p=>p['Kelompok Umur']===k).sort((x,y)=>(parseFloat(x.Umur)||0)-(parseFloat(y.Umur)||0)||String(x.Nama).localeCompare(y.Nama));
      return `<div class="card"><div class="row" style="padding-top:0"><div class="grow b gold" style="font-size:16px">Kelompok ${esc(k)}</div><span class="pill">${A.length} anak</span></div>`+
      A.map(p=>{ const jw=anakJuara(p.Nama); return `<div class="row" style="padding:7px 2px"><div class="time" style="min-width:42px;font-size:18px">${esc(String(p.Umur).replace('.',','))}<small>tahun</small></div><div class="grow"><div class="b">${esc(p.Nama)}</div><div class="sm mut">${esc(p.OU)}${p['Anak Dari']?' · Anak dari '+esc(p['Anak Dari']):''}</div>${jw.length?`<div class="sm" style="margin-top:3px">${jw.map(x=>`<span class="pill gold">🏆 ${esc(x)}</span>`).join(' ')}</div>`:''}</div></div>`; }).join('')+`</div>`; }).join('');
  }
  h+=`<div class="sec-title">🏅 Lomba & Juara</div>`;
  if(!L.length) return h+'<div class="card empty">Jenis lomba per kelompok umur akan diumumkan panitia.</div>';
  return h+`<div class="card"><table><tr><th>Kelompok</th><th>Lomba</th><th>Juara</th></tr>`+L.slice().sort((a,b)=>kelSort(a['Kelompok Umur'],b['Kelompok Umur'])).map(a=>`<tr><td>${esc(a['Kelompok Umur'])}</td><td>${esc(a.Lomba)}</td><td class="sm">${['1','2','3'].map(j=>a['Juara '+j]?`${j}. ${esc(a['Juara '+j])}`:'').filter(Boolean).join('<br>')||'<span class="mut">–</span>'}</td></tr>`).join('')+`</table></div>`;
}

document.querySelectorAll('nav.bn a').forEach(a=>a.onclick=()=>{ PAGE=a.dataset.p; if(!D) return; if(OPEN) closeSheet(); render(); scrollTo(0,0); });
