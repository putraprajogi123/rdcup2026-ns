<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063d2e">
<title>Panitia · RD Cup 2026</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>(function(){var p;try{p=localStorage.getItem('RD_THEME')}catch(e){}var d=new Date(),h=d.getHours()+d.getMinutes()/60;document.documentElement.dataset.theme=(p==='light'||p==='dark')?p:((h>=5.5&&h<18)?'light':'dark');})()</script>
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:30px}
.mrow{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;margin:6px 0}
.mrow input{text-align:center;font-family:'Bebas Neue';font-size:24px;padding:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:11.5px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.tabs.chips{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:4px 0 8px}
.tabs .chip{padding:8px 12px}
.stat{display:flex;justify-content:space-around;text-align:center;margin-top:10px}
.stat b{display:block;font-family:'Bebas Neue';font-size:28px;color:var(--gold);line-height:1}
.stat span{font-size:10.5px;color:var(--mut)}
.mlist .m{margin-bottom:8px;cursor:pointer}
#errbox{position:sticky;top:64px;z-index:15;max-width:720px;margin:0 auto;padding:0 14px}
.slot{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1.5px solid transparent}
.slot .ps{font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;min-width:34px;color:var(--gold)}
[data-theme=light] .slot .ps{color:var(--g)}
.slot.sel{border-color:var(--gold);background:rgba(245,215,122,.18)}
[data-theme=light] .slot.sel{border-color:#d4a83a;background:#fff4cc}
.slot.lock{opacity:.5;cursor:not-allowed}
.posin{width:64px!important;text-align:center;font-size:18px!important;padding:6px!important}
.pv{padding:8px 10px;border-radius:10px;margin:6px 0;background:rgba(255,255,255,.06);border:1px solid var(--line)}
[data-theme=light] .pv{background:#f3f7f4}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>MODE DEMO — PIN contoh: Admin 201126 · Panitia 2026 · Juri 1919</div>
<div class="topbar" style="gap:8px"><h2 style="font-size:20px;white-space:nowrap">🛠️ Panitia</h2><span class="grow"></span><span id="who" class="pill gold" hidden></span><button class="thbtn" id="thbtn" onclick="RC.cycleTheme()"></button><a href="index.html" class="btn ghost" style="padding:7px 10px;white-space:nowrap">App</a></div>
<main class="wrap" id="page"></main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const {esc,$}=RC;
let D=null, PIN=sessionStorage.getItem('RD_PIN')||'', ROLE=sessionStorage.getItem('RD_ROLE')||'', JURI=sessionStorage.getItem('RD_JURI')||'';
let TAB='skor', SEL={cab:'',match:'',gkat:'Putra',grow:'',bcab:''};
const BUSY={v:false};

async function call(body,okMsg){
  if(BUSY.v) return; BUSY.v=true;
  try{ const j=await RC.post(Object.assign({pin:PIN},body)); if(j.data) D=j.data; if(okMsg) RC.toast(okMsg); return j.result; }
  catch(e){ showErr(e.message); throw e; }
  finally{ BUSY.v=false; }
}
function showErr(msg){
  let b=$('#errbox'); if(!b){ b=document.createElement('div'); b.id='errbox'; document.body.appendChild(b); }
  b.innerHTML=`<div class="card" style="border-color:var(--live);border-width:2px"><div class="row" style="align-items:flex-start"><div style="font-size:24px">⚠️</div><div class="grow"><div class="b" style="color:var(--live)">Tidak bisa diproses</div><div class="sm" style="white-space:pre-wrap;margin-top:4px">${esc(msg)}</div></div><span class="chev" style="cursor:pointer;color:var(--live)" onclick="this.closest('#errbox').innerHTML=''">✕</span></div></div>`;
  b.scrollIntoView({behavior:'smooth',block:'center'});
}
async function reload(){ try{ D=await RC.load(); }catch(e){ D=RC.cached(); RC.toast('Gagal memuat data',true);} render(); }

function render(){
  $('#demo').hidden=!RC.DEMO;
  if(!ROLE) return login();
  $('#who').hidden=false; $('#who').textContent=ROLE.toUpperCase()+(ROLE==='juri'&&JURI?' · '+JURI:'');
  const tabs=[['skor','🎾 Skor','admin panitia'],['golf','⛳ Golf','admin panitia'],['karaoke','🎤 Nilai Karaoke','admin juri'],['bagan','🧩 Buat Bagan','admin'],['atur','🔀 Atur Bagan','admin'],['tim','✏️ Edit Tim','admin panitia'],['info','📢 Pengumuman','admin panitia'],['rekap','📊 Rekap','admin panitia']].filter(t=>t[2].includes(ROLE));
  if(!tabs.find(t=>t[0]===TAB)) TAB=tabs[0][0];
  let h=`<div class="tabs chips">`+tabs.map(t=>`<span class="chip ${t[0]===TAB?'on':''}" onclick="TAB='${t[0]}';render()">${t[1]}</span>`).join('')+`<span class="chip" onclick="reload()">🔄</span><span class="chip" onclick="logout()">Keluar</span></div>`;
  h+={skor,golf,karaoke,bagan,atur,tim,info,rekap}[TAB]();
  $('#page').innerHTML=h;
}

function login(){
  $('#page').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><div style="font-size:40px">🔐</div><h2 class="gold" style="font-size:28px">Masuk Panitia</h2><p class="sm mut" style="margin-bottom:14px">Masukkan PIN Admin, Panitia, atau Juri</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="text-align:center;font-size:22px;letter-spacing:.3em"><button class="btn wide" style="margin-top:12px" onclick="doLogin()">Masuk</button></div>`;
  $('#pin').onkeydown=e=>{ if(e.key==='Enter') doLogin(); }; $('#pin').focus();
}
async function doLogin(){
  PIN=$('#pin').value.trim();
  try{ const r=await call({action:'login'}); ROLE=r.role; sessionStorage.setItem('RD_PIN',PIN); sessionStorage.setItem('RD_ROLE',ROLE);
    if(ROLE==='juri') return pickJuri(r.juri); render(); }catch(e){}
}
function pickJuri(list){
  const names=String(list||'').split(',').map(s=>s.trim()).filter(Boolean);
  $('#page').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><h2 class="gold" style="font-size:26px">Pilih Nama Juri</h2><div style="display:grid;gap:8px;margin-top:12px">${names.map(n=>`<button class="btn ghost" onclick="JURI='${esc(n)}';sessionStorage.setItem('RD_JURI',JURI);TAB='karaoke';render()">${esc(n)}</button>`).join('')}</div></div>`;
}
function logout(){ sessionStorage.clear(); PIN=ROLE=JURI=''; render(); }

/* ---------- SKOR ---------- */
function bCabs(){ return (D.Cabang||[]).filter(c=>c.Tipe==='BAGAN'); }
function skor(){
  const cs=bCabs(); if(!SEL.cab) SEL.cab=(cs[0]||{}).Kode;
  let h=`<div class="lbl">Cabang</div><select onchange="SEL.cab=this.value;SEL.match='';render()">${cs.map(c=>`<option value="${esc(c.Kode)}" ${c.Kode===SEL.cab?'selected':''}>${esc(c.Nama)}</option>`).join('')}</select>`;
  const ms=RC.matchesOf(D,SEL.cab); if(!ms.length) return h+`<div class="empty">Bagan belum dibuat.${ROLE==='admin'?' Buka menu 🧩 Buat Bagan.':' Hubungi admin.'}</div>`;
  const R=Math.max(...ms.map(m=>+m.Babak));
  if(SEL.match) return h+editor(ms.find(m=>m.ID===SEL.match),R);
  const play=ms.filter(m=>m['Tim A']!=='BYE'&&m['Tim B']!=='BYE');
  h+=`<div class="stat card"><div><b>${play.filter(m=>m.Status==='Selesai').length}</b><span>Selesai</span></div><div><b style="color:var(--live)">${play.filter(m=>m.Status==='Berlangsung').length}</b><span>Live</span></div><div><b>${play.filter(m=>m.Status!=='Selesai').length}</b><span>Sisa</span></div></div>`;
  for(let r=1;r<=R;r++){
    const L=play.filter(m=>+m.Babak===r); if(!L.length) continue;
    h+=`<div class="sec-title">${RC.roundLabel(r,R)}</div><div class="mlist">`+L.map(m=>{ const ready=m['Tim A']&&m['Tim B'];
      return `<div class="m ${m.Status==='Berlangsung'?'live':''}" ${ready?`onclick="SEL.match='${m.ID}';render()"`:''} style="${ready?'':'opacity:.5'}"><div class="t ${m.Status==='Selesai'&&m.Pemenang===m['Tim A']?'win':''}"><span class="nm">${esc(RC.disp(D,SEL.cab,m['Tim A'])||'menunggu…')}</span><span class="sc">${esc(m['Skor A'])}</span></div><div class="t ${m.Status==='Selesai'&&m.Pemenang===m['Tim B']?'win':''}"><span class="nm">${esc(RC.disp(D,SEL.cab,m['Tim B'])||'menunggu…')}</span><span class="sc">${esc(m['Skor B'])}</span></div><div class="meta"><span>#${m.No}${m.Jam?' · '+esc(m.Jam):''}${m.Lapangan?' · '+esc(m.Lapangan):''}</span><span>${m.Status==='Berlangsung'?'<b style="color:var(--live)">● LIVE</b>':esc(m.Status)}${ready?' ›':''}</span></div></div>`; }).join('')+`</div>`;
  }
  return h;
}
function editor(m,R){
  return `<div class="card" style="margin-top:12px"><div class="row"><span class="back gold" style="font-size:22px;cursor:pointer" onclick="SEL.match='';render()">‹</span><div class="grow"><div class="b gold">${RC.roundLabel(+m.Babak,R)} · #${m.No}</div><div class="sm mut">${esc(m.Status)}${m.Pemenang?' · Pemenang: '+esc(m.Pemenang):''}</div></div></div>
  <div class="mrow"><div class="b">${esc(RC.disp(D,SEL.cab,m['Tim A']))}</div><input id="sa" type="number" inputmode="numeric" value="${esc(m['Skor A'])}"></div>
  <div class="mrow"><div class="b">${esc(RC.disp(D,SEL.cab,m['Tim B']))}</div><input id="sb" type="number" inputmode="numeric" value="${esc(m['Skor B'])}"></div>
  <div class="two"><div><div class="lbl">Lapangan / Meja</div><input id="lap" value="${esc(m.Lapangan)}" placeholder="mis. Lap 1"></div><div><div class="lbl">Jam</div><input id="jam" value="${esc(m.Jam)}" placeholder="14:30"></div></div>
  <div class="lbl">Jika skor seri / WO, pilih pemenang</div><select id="pw"><option value="">— otomatis dari skor —</option><option value="A">${esc(RC.disp(D,SEL.cab,m['Tim A']))}</option><option value="B">${esc(RC.disp(D,SEL.cab,m['Tim B']))}</option></select>
  <div style="display:grid;gap:8px;margin-top:14px">
    <button class="btn ghost" onclick="saveM('${m.ID}','Berlangsung')">🔴 Simpan sebagai LIVE (skor sementara)</button>
    <button class="btn" onclick="saveM('${m.ID}','Selesai')">✅ Simpan HASIL AKHIR</button>
    ${m.Status!=='Belum'?`<button class="btn ghost" onclick="if(confirm('Kosongkan hasil pertandingan ini?'))saveM('${m.ID}','Belum',true)">↩️ Reset</button>`:''}
  </div><p class="sm mut" style="margin-top:10px">Hasil akhir otomatis memajukan pemenang ke babak berikutnya.</p></div>`;
}
async function saveM(id,status,reset){
  const a=reset?'':$('#sa').value, b=reset?'':$('#sb').value, pw=reset?'':$('#pw').value;
  if(status==='Selesai'&&!pw&&(a===''||b===''||a===b)) return RC.toast('Isi skor (tidak seri) atau pilih pemenang',true);
  try{ await call({action:'saveMatch',id,skorA:a,skorB:b,lapangan:reset?'':$('#lap').value,jam:reset?'':$('#jam').value,status,pemenang:pw},status==='Selesai'?'✅ Hasil tersimpan':'Tersimpan');
  if(status!=='Berlangsung') SEL.match=''; render(); }catch(e){}
}

/* ---------- GOLF ---------- */
function golf(){
  const pars=RC.pars(D), H=RC.golfHoles(D,SEL.gkat); const L=(D.Golf||[]).filter(g=>g.Kategori===SEL.gkat);
  let h=`<div class="chips" style="margin-top:6px">${['Putra','Putri'].map(k=>`<span class="chip ${k===SEL.gkat?'on':''}" onclick="SEL.gkat='${k}';SEL.grow='';render()">${k} · ${RC.golfHoles(D,k).length} hole</span>`).join('')}</div>
  <div class="lbl">Pemain</div><select onchange="SEL.grow=this.value;render()"><option value="">— pilih pemain —</option>${L.map(g=>{const x=RC.golfCalc(g,pars,H);return `<option value="${g._row}" ${String(g._row)===String(SEL.grow)?'selected':''}>${esc(g.Nama)} (${esc(g.OU)}) — ${x.done?'F':'thru '+x.thru}</option>`;}).join('')}<option value="new" ${SEL.grow==='new'?'selected':''}>➕ Tambah pemain baru…</option></select>`;
  if(!SEL.grow) return h+`<div class="empty">Pilih pemain untuk input skor per hole.<br>Golf ${esc(SEL.gkat)}: <b>${H.length} hole</b> (Hole ${H[0]+1}–${H[H.length-1]+1}).</div>`;
  const g=SEL.grow==='new'?{}:L.find(x=>String(x._row)===String(SEL.grow))||{};
  if(SEL.grow==='new') h+=`<div class="two"><div><div class="lbl">Nama</div><input id="gn"></div><div><div class="lbl">OU</div><input id="go"></div></div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="sm gold b" style="margin-bottom:6px">${H.length} hole · Hole ${H[0]+1}–${H[H.length-1]+1}</div><div class="golfgrid">`;
  for(let k=0;k<H.length;k+=9){ const part=H.slice(k,k+9);
    part.forEach(i=>h+=`<div class="h">${i+1}<div class="p">P${pars[i]}</div></div>`); for(let j=part.length;j<9;j++) h+='<div></div>';
    part.forEach(i=>h+=`<input class="gh" data-i="${i}" type="number" inputmode="numeric" value="${esc(g['H'+(i+1)]||'')}" oninput="gCalc()">`); for(let j=part.length;j<9;j++) h+='<div></div>'; }
  h+=`</div><div class="stat" id="gst"></div><button class="btn wide" style="margin-top:12px" onclick="saveG()">💾 Simpan Skor</button></div>`;
  setTimeout(gCalc,0); return h;
}
function gScores(){ const sc=Array(18).fill(''); const g=RC.golfDraft||{}; document.querySelectorAll('.gh').forEach(i=>sc[+i.dataset.i]=i.value.trim()); return sc; }
function gCalc(){
  const pars=RC.pars(D), H=RC.golfHoles(D,SEL.gkat), r={}; gScores().forEach((v,i)=>r['H'+(i+1)]=v); const x=RC.golfCalc(r,pars,H);
  $('#gst').innerHTML=`<div><b>${x.thru}/${x.n}</b><span>Thru</span></div><div><b>${x.gross}</b><span>Gross</span></div><div><b>${x.pts}</b><span>Poin</span></div><div><b>${x.done?x.hcp:'–'}</b><span>HCP</span></div><div><b>${x.done?x.nett:'–'}</b><span>Nett</span></div>`;
}
async function saveG(){
  const sc=gScores(); if(sc.some(v=>v!==''&&(+v<1||+v>15))) return RC.toast('Ada skor hole tidak wajar (1–15)',true);
  const body={action:'saveGolf',row:SEL.grow==='new'?'':SEL.grow,kategori:SEL.gkat,scores:sc};
  if(SEL.grow==='new'){ body.nama=$('#gn').value.trim(); body.ou=$('#go').value.trim(); if(!body.nama) return RC.toast('Nama wajib diisi',true); }
  try{ const r=await call(body,'⛳ Skor tersimpan'); SEL.grow=String(r.row); render(); }catch(e){}
}

/* ---------- KARAOKE ---------- */
function karaoke(){
  const juris=String(RC.setting(D,'Juri_Karaoke')).split(',').map(s=>s.trim()).filter(Boolean);
  if(!JURI) JURI=ROLE==='admin'?juris[0]||'':'';
  let h=`<div class="lbl">Juri</div>`+(ROLE==='admin'?`<select onchange="JURI=this.value;render()">${juris.map(j=>`<option ${j===JURI?'selected':''}>${esc(j)}</option>`).join('')}</select>`:`<div class="card b gold">${esc(JURI)}</div>`);
  const L=(D.Karaoke||[]).slice().sort((a,b)=>+a.No-+b.No); if(!L.length) return h+`<div class="empty">Peserta karaoke belum diisi di Google Sheets (tab Karaoke).</div>`;
  const val=no=>{ const n=(D.Karaoke_Nilai||[]).find(x=>String(x.No)===String(no)&&x.Juri===JURI); return n?n.Nilai:''; };
  h+=`<p class="sm mut" style="margin:10px 2px">Isi nilai 0–100 lalu tekan 💾. Nilai bisa diubah kapan saja.</p>`;
  h+=L.map(k=>`<div class="card"><div class="row"><div class="time">${esc(k.No)}</div><div class="grow"><div class="b">${esc(k.Nama)}</div><div class="sm mut">${esc(k.Kategori)} · ${esc(k.OU)} · 🎵 ${esc(k.Lagu)}</div></div></div><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="kn${esc(k.No)}" type="number" inputmode="decimal" min="0" max="100" value="${esc(val(k.No))}" placeholder="Nilai 0–100" style="font-size:20px;text-align:center"><button class="btn" onclick="saveK('${esc(k.No)}')">💾</button></div></div>`).join('');
  return h;
}
async function saveK(no){
  const v=$('#kn'+no).value; if(v===''||+v<0||+v>100) return RC.toast('Nilai harus 0–100',true);
  if(!JURI) return RC.toast('Pilih juri dulu',true);
  await call({action:'saveKaraoke',no,juri:JURI,nilai:v},'🎤 Nilai no. '+no+' tersimpan'); render();
}

/* ---------- BAGAN (posisi manual) ---------- */
let PV=null;
function cabSel(key,onch){ const cs=bCabs(); if(!SEL[key]) SEL[key]=(cs[0]||{}).Kode;
  return `<div class="lbl">Cabang</div><select onchange="SEL.${key}=this.value;PV=null;SEL.sw=null;render()">${cs.map(c=>`<option value="${esc(c.Kode)}" ${c.Kode===SEL[key]?'selected':''}>${esc(c.Nama)}</option>`).join('')}</select>`; }
function bagan(){
  let h=cabSel('bcab'); const kode=SEL.bcab;
  const teams=(D.Tim||[]).filter(t=>t['Kode Cabang']===kode); const ms=RC.matchesOf(D,kode);
  const played=ms.filter(m=>m.Status!=='Belum'&&m['Tim A']!=='BYE'&&m['Tim B']!=='BYE').length;
  h+=`<div class="card" style="margin-top:12px"><div class="b gold">${teams.length} tim/pemain terdaftar · ${ms.length?'bagan SUDAH ada':'bagan belum dibuat'}${played?` · <span style="color:var(--live)">${played} pertandingan berskor</span>`:''}</div>
  <p class="sm mut" style="margin:6px 0 4px">Isi <b>nomor posisi</b> sesuai kertas kocokan. Posisi 1 lawan 2, 3 lawan 4, 5 lawan 6, dst. Posisi yang tidak diisi siapa pun = <b>BYE</b>.</p>${(()=>{ const n=teams.length; let S=2; while(S<n) S*=2; const by=S-n; return by?`<div class="sm" style="margin-top:6px;padding:8px;border-radius:8px;background:rgba(245,215,122,.15)">💡 ${n} peserta → bagan <b>${S} posisi</b>, ada <b>${by} BYE</b>. Agar tidak BYE lawan BYE, posisi kosong harus di <b>${Array.from({length:by},(_,i)=>2*(i+1)).join(', ')}</b>. Jadi kertas kocokan berisi posisi: <b>${Array.from({length:S},(_,i)=>i+1).filter(x=>!(x%2===0&&x<=2*by)).join(', ')}</b>.</div>`:''; })()}</div>`;
  if(!teams.length) return h+`<div class="empty">Belum ada peserta untuk cabang ini di tab Tim.</div>`;
  h+=`<div class="card">`+teams.map((t,i)=>`<div class="row"><input class="posin" type="number" inputmode="numeric" min="1" data-n="${esc(t['Nama Tim'])}" data-k="${esc(t['Pemain 1'])}" value="${esc(t['Urut Undian'])}" oninput="PV=null;document.getElementById('pvbox').innerHTML=''" placeholder="–"><div class="grow"><div class="b">${t['Nama Tim']?esc(t['Nama Tim']):'<span style="color:var(--live)">⚠️ Nama Tim kosong</span>'}</div><div class="sm mut">${esc([t['Pemain 1'],t['Pemain 2']].filter(Boolean).join(' / '))}</div></div></div>`).join('')+
  `<button class="btn wide" style="margin-top:12px" onclick="preview()">👁️ Pratinjau Bagan</button></div><div id="pvbox"></div>`;
  setTimeout(()=>{ if(PV) renderPV(); },0);
  return h;
}
function posMap(){ const o={}; document.querySelectorAll('.posin').forEach(i=>o[i.dataset.n]=i.value.trim()); return o; }
function preview(){
  const pm=posMap(); const L=[...document.querySelectorAll('.posin')].map(i=>({nama:i.dataset.n,pos:i.value.trim(),ket:i.dataset.k}));
  const pl=RC.plan(SEL.bcab,L);
  PV={pm,pl}; renderPV();
}
function renderPV(){
  const {pl}=PV, box=$('#pvbox'); if(!box) return;
  if(pl.err.length){ box.innerHTML=`<div class="card" style="border:2px solid var(--live)"><div class="b" style="color:var(--live)">❌ Belum bisa dibuat</div><ul class="sm" style="margin:6px 0 0 18px">${pl.err.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`; return; }
  const r1=pl.matches.filter(m=>m.Babak==='1'); const R=pl.rounds;
  const ms=RC.matchesOf(D,SEL.bcab); const played=ms.filter(m=>m.Status!=='Belum'&&m['Tim A']!=='BYE'&&m['Tim B']!=='BYE').length;
  const cab=(D.Cabang||[]).find(c=>c.Kode===SEL.bcab)||{};
  box.innerHTML=`<div class="card" style="border:2px solid var(--ok)"><div class="b" style="color:var(--ok)">✅ Pratinjau ${RC.roundLabel(1,R)} — cocokkan dengan kertas kocokan</div>
  ${r1.map(m=>{ const pa=(+m.No-1)*2+1; return `<div class="pv"><div class="sm mut">Pertandingan ${m.No}</div><div><b>${pa}.</b> ${m['Tim A']==='BYE'?'<i class="mut">BYE</i>':'<b>'+esc(m['Tim A'])+'</b>'} &nbsp;vs&nbsp; <b>${pa+1}.</b> ${m['Tim B']==='BYE'?'<i class="mut">BYE</i>':'<b>'+esc(m['Tim B'])+'</b>'}</div>${m.Pemenang?`<div class="sm" style="color:var(--ok)">→ ${esc(m.Pemenang)} langsung lolos</div>`:''}</div>`; }).join('')}
  <p class="sm mut">Bagan ${pl.size} posisi · ${R} babak · ${pl.matches.length} kotak pertandingan.</p>
  ${ms.length?`<div class="sm" style="color:var(--live);margin:8px 0">⚠️ Bagan lama akan DIGANTI${played?` dan <b>${played} skor akan TERHAPUS</b>. Ketik nama cabang untuk konfirmasi:`:'.'}</div>`:''}
  ${played?`<input id="konf" placeholder="${esc(cab.Nama)}" style="margin-bottom:8px">`:''}
  <button class="btn wide" onclick="saveB()">💾 ${ms.length?'Ganti':'Simpan'} Bagan</button></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveB(){
  const k=$('#konf'); try{ await call({action:'generateBracket',kode:SEL.bcab,posisi:PV.pm,konfirmasi:k?k.value:''},'🧩 Bagan tersimpan'); PV=null; TAB='atur'; SEL.acab=SEL.bcab; render(); }catch(e){}
}

/* ---------- ATUR BAGAN (tukar / ganti posisi) ---------- */
function atur(){
  let h=cabSel('acab'); const kode=SEL.acab; const ms=RC.matchesOf(D,kode); const r1=ms.filter(m=>m.Babak==='1');
  if(!r1.length) return h+`<div class="empty">Bagan belum dibuat. Buka 🧩 Buat Bagan.</div>`;
  const R=Math.max(...ms.map(m=>+m.Babak));
  const lock=m=>{ const bye=m['Tim A']==='BYE'||m['Tim B']==='BYE'; if(!bye&&m.Status!=='Belum') return true; const n=ms.find(x=>x.ID===m['Next ID']); return !!(n&&n.Status!=='Belum'); };
  const placed=new Set(r1.flatMap(m=>[m['Tim A'],m['Tim B']]));
  const free=(D.Tim||[]).filter(t=>t['Kode Cabang']===kode&&!placed.has(t['Nama Tim']));
  const sw=SEL.sw;
  h+=`<p class="sm mut" style="margin:10px 2px">Ketuk satu posisi, lalu ketuk posisi lain untuk <b>MENUKAR</b>. Posisi 🔒 terkunci karena sudah dimainkan (reset skornya dulu di menu Skor).</p>`;
  if(sw){ const m=r1.find(x=>x.ID===sw.id); const cur=m['Tim '+sw.slot];
    h+=`<div class="card" style="border:2px solid var(--gold);position:sticky;top:64px;z-index:5"><div class="b">Dipilih: posisi ${(+m.No-1)*2+(sw.slot==='A'?1:2)} · ${esc(cur)}</div><div class="sm mut" style="margin:4px 0 8px">Ketuk posisi lain untuk menukar, atau ganti langsung:</div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:8px"><select id="gt"><option value="BYE">— jadikan BYE (kosong) —</option>${free.map(t=>`<option>${esc(t['Nama Tim'])}</option>`).join('')}</select><button class="btn" onclick="gantiSlot()">Ganti</button></div>
    <button class="btn ghost wide" style="margin-top:8px" onclick="SEL.sw=null;render()">Batal</button></div>`; }
  h+=r1.map(m=>{ const L=lock(m); return `<div class="card" style="padding:8px 10px"><div class="sm mut" style="padding:2px 4px">${RC.roundLabel(1,R)} · Pertandingan ${m.No}${L?' 🔒':''}</div>`+['A','B'].map(sl=>{ const n=m['Tim '+sl]; const isSel=sw&&sw.id===m.ID&&sw.slot===sl;
    return `<div class="slot ${isSel?'sel':''} ${L?'lock':''}" ${L?'':`onclick="pick('${m.ID}','${sl}')"`}><span class="ps">${(+m.No-1)*2+(sl==='A'?1:2)}</span><span class="grow ${n==='BYE'?'mut':'b'}">${n==='BYE'?'BYE (kosong)':esc(RC.disp(D,kode,n))}</span>${m.Status==='Selesai'&&m.Pemenang===n&&n!=='BYE'?'<span class="pill done">lolos</span>':''}</div>`; }).join('')+`</div>`; }).join('');
  if(free.length) h+=`<div class="card"><div class="b gold">Belum masuk bagan (${free.length})</div><div class="sm">${free.map(t=>esc(t['Nama Tim'])).join(', ')}</div><div class="sm mut">Pilih posisi BYE lalu "Ganti" untuk memasukkannya.</div></div>`;
  return h;
}
async function pick(id,sl){
  if(!SEL.sw){ SEL.sw={id,slot:sl}; return render(); }
  if(SEL.sw.id===id&&SEL.sw.slot===sl){ SEL.sw=null; return render(); }
  const a=SEL.sw; SEL.sw=null;
  try{ await call({action:'swapSlots',kode:SEL.acab,a,b:{id,slot:sl}},'🔀 Posisi ditukar'); }catch(e){}
  render();
}
async function gantiSlot(){
  const v=$('#gt').value, s=SEL.sw;
  try{ await call({action:'setSlot',id:s.id,slot:s.slot,tim:v},'✅ Posisi diganti'); SEL.sw=null; }catch(e){}
  render();
}

/* ---------- EDIT TIM ---------- */
function tim(){
  let h=cabSel('tcab'); const kode=SEL.tcab; const L=(D.Tim||[]).filter(t=>t['Kode Cabang']===kode);
  if(!L.length) return h+`<div class="empty">Belum ada peserta di cabang ini.</div>`;
  if(SEL.tn){ const t=L.find(x=>x['Nama Tim']===SEL.tn); if(t) return h+`<div class="card" style="margin-top:12px"><div class="row"><span class="gold" style="font-size:22px;cursor:pointer" onclick="SEL.tn='';render()">‹</span><div class="grow"><div class="b gold">${esc(t['Nama Tim'])}</div><div class="sm mut">Nama tim tidak bisa diubah di sini (dipakai di bagan)</div></div></div>
    <div class="lbl">Pemain 1</div><input id="e1" value="${esc(t['Pemain 1'])}"><div class="lbl">Pemain 2 ${!t['Pemain 2']?'(kosongkan untuk single — nama di bagan mengikuti Pemain 1)':''}</div><input id="e2" value="${esc(t['Pemain 2'])}">
    <div class="two"><div><div class="lbl">OU</div><input id="e3" value="${esc(t.OU)}"></div><div><div class="lbl">Kelas</div><input id="e4" value="${esc(t.Kelas)}"></div></div>
    <button class="btn wide" style="margin-top:14px" onclick="saveT()">💾 Simpan Perubahan</button><p class="sm mut" style="margin-top:8px">Skor & posisi di bagan tidak berubah. Perubahan tercatat di tab Log.</p></div>`; }
  return h+`<p class="sm mut" style="margin:10px 2px">Ketuk tim untuk mengganti nama pemain / pasangan.</p><div class="card">`+L.map(t=>`<div class="row click" onclick="SEL.tn='${esc(t['Nama Tim']).replace(/'/g,"\\'")}';render()"><div class="grow"><div class="b">${esc(t['Nama Tim'])}${t['Urut Undian']?` <span class="pill">Posisi ${esc(t['Urut Undian'])}</span>`:''}</div><div class="sm mut">${esc([t['Pemain 1'],t['Pemain 2']].filter(Boolean).join(' / '))}</div></div><span class="chev">›</span></div>`).join('')+`</div>`;
}
async function saveT(){
  try{ await call({action:'editTim',kode:SEL.tcab,nama:SEL.tn,p1:$('#e1').value,p2:$('#e2').value,ou:$('#e3').value,kelas:$('#e4').value},'✅ Data tim tersimpan'); SEL.tn=''; }catch(e){}
  render();
}

/* ---------- REKAP KONSUMSI ---------- */
function rekap(){
  const RK=RC.rekap(D), RP=RK.RP;
  const rr=(l,v,b)=>`<div class="row"><div class="grow">${l}</div><div class="${b?'bebas gold':'b'}" style="${b?'font-size:28px;line-height:1':''}">${v}</div></div>`;
  let h=`<div class="card" style="margin-top:8px;border:2px solid var(--gold2)"><div class="b gold">📊 Rekap Jumlah Orang</div>`+rr('Peserta dewasa',RP.adults.length)+rr('Peserta anak',RP.anak.length)+rr('Panitia bukan peserta',RK.bukan+' <span class="sm mut">(dari '+RK.pan.length+')</span>')+rr('Non peserta'+(RK.nonList.length?' <span class="sm mut">('+RK.nonList.map(x=>esc(x[0])+' '+x[1]).join(' · ')+')</span>':''),RK.non)+rr('Tambahan <span class="sm mut">(Pengaturan → Tambahan_Konsumsi)</span>',RK.tambahan)+rr('<b>TOTAL ORANG</b>',RK.total,1)+`</div>`;
  const K=RC.konsumsi(D);
  h+=`<div class="sec-title">🍽️ Konsumsi per Sesi</div>`;
  if(!K.rows.length) h+=`<div class="card empty">Tab <b>Konsumsi</b> belum diisi. Jalankan <b>setup</b> di Apps Script untuk membuat tab beserta usulan sesinya.</div>`;
  else{
    h+=`<div class="card" style="padding:8px 10px">`;
    let last='';
    K.rows.forEach((r,i)=>{
      if(r.tanggal!==last){ last=r.tanggal; h+=`<div class="sm gold b" style="margin:8px 2px 2px">${esc(RC.fmtTgl(r.tanggal))}</div>`; }
      const op=SEL['ks'+i];
      h+=`<div class="row click" style="padding:8px 2px" onclick="SEL['ks${i}']=!SEL['ks${i}'];render()"><div class="grow"><div class="b">${esc(r.makan)}</div><div class="sm mut">📍 ${esc(r.lokasi)} · ${esc(r.untuk)}</div>${r.bad.length?`<div class="sm" style="color:var(--live)">⚠️ Kode tidak dikenal: ${esc(r.bad.join(', '))}</div>`:''}</div><div class="bebas gold" style="font-size:26px;line-height:1">${r.total}</div><span class="chev">${op?'⌄':'›'}</span></div>`;
      if(op){
        const nonS=Object.entries(r.nonSt).map(x=>esc(x[0])+' '+x[1]).join(' · ');
        const lst=(lab,arr)=>arr.length?`<details style="margin:4px 0"><summary class="sm"><b>${lab}</b> (${arr.length})</summary><div class="sm mut" style="padding:4px 0 2px 12px">${arr.map(esc).join(', ')}</div></details>`:'';
        h+=`<div class="pv" style="margin:0 0 8px"><div class="sm">Peserta <b>${r.nm.peserta.length}</b> · Anak <b>${r.nm.anak.length}</b> · Panitia <b>${r.nm.panitia.length}</b> · Non peserta <b>${r.nm.non.length}</b>${nonS?' ('+nonS+')':''} · Tambahan <b>${r.tambahan}</b></div>`+
          lst('Peserta',r.nm.peserta)+lst('Anak',r.nm.anak)+lst('Panitia',r.nm.panitia)+lst('Non peserta',r.nm.non.map(n=>n.nama+' ('+n.status+')'))+`</div>`;
      }
    });
    h+=`<div class="row" style="border:0;padding-top:10px"><div class="grow b">Total porsi semua sesi</div><div class="bebas gold" style="font-size:28px">${K.rows.reduce((s,r)=>s+r.total,0)}</div></div>`;
    h+=`<button class="btn wide" style="margin-top:6px" onclick="copyKonsumsi()">📋 Salin untuk WA vendor</button><textarea id="kwa" style="position:absolute;left:-9999px">${esc(RC.konsumsiWA(D,K))}</textarea></div>`;
    if(K.warnNon.length) h+=`<div class="card" style="border-color:var(--live)"><div class="b" style="color:var(--live)">⚠️ Kode sesi di tab Non_Peserta tidak dikenal</div><div class="sm">${K.warnNon.map(esc).join('<br>')}</div><div class="sm mut" style="margin-top:4px">Pastikan sama persis dengan kolom Kode di tab Konsumsi.</div></div>`;
  }
  h+=`<div class="sec-title">🔎 Cek Pencocokan Nama</div><p class="sm mut" style="margin:-4px 2px 8px">Aplikasi menganggap nama-nama di bawah ini <b>orang yang sama</b> (beda ejaan/singkatan). Kalau ada yang keliru, perbaiki penulisan namanya di Sheets.</p>`;
  const J=RK.pan.filter(p=>p.peserta);
  h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">Panitia yang juga peserta (${J.length})</div>`+(J.map(p=>`<div class="row sm" style="display:block"><b>${esc(p.nama)}</b> <span class="mut">(${esc(p.seksi)})</span><br>= ${esc(p.peserta.nama)} <span class="mut">· ${esc(p.peserta.ou)} · ${esc(p.peserta.cab.join(', '))}</span></div>`).join('')||'<div class="empty">Tidak ada</div>')+`</div>`;
  h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">Nama peserta yang digabung (${RP.merges.length})</div>`+(RP.merges.map(m=>`<div class="row sm"><span class="grow">${esc(m[0])}</span><span class="mut">=</span><span class="grow" style="text-align:right">${esc(m[1])}</span></div>`).join('')||'<div class="empty">Tidak ada</div>')+`</div>`;
  h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">Non peserta tidak dihitung lagi (${RP.nonSkip.length})</div><p class="sm mut" style="margin-bottom:4px">Nama di tab Non_Peserta yang ternyata sudah terdaftar sebagai peserta/panitia, atau tertulis 2 kali.</p>`+(RP.nonSkip.map(x=>`<div class="row sm"><span class="grow">${esc(x.nama)}</span><span class="mut">${esc(x.alasan)}</span></div>`).join('')||'<div class="empty">Tidak ada</div>')+`</div>`;
  const N=RK.pan.filter(p=>!p.peserta);
  h+=`<div class="card"><div class="b gold" style="margin-bottom:4px">Panitia bukan peserta (${N.length})</div><div class="sm">${N.map(p=>esc(p.nama)).join(', ')}</div></div>`;
  return h;
}

async function copyKonsumsi(){
  const t=$('#kwa').value;
  try{ await navigator.clipboard.writeText(t); RC.toast('📋 Tersalin — tempel di WA'); }
  catch(e){ const x=$('#kwa'); x.style.position='static'; x.style.width='100%'; x.rows=10; x.select(); RC.toast('Tekan Ctrl+C / Salin',true); }
}

/* ---------- PENGUMUMAN ---------- */
function info(){
  return `<div class="card" style="margin-top:8px"><div class="lbl">Judul</div><input id="pj" placeholder="mis. Perubahan jadwal tenis"><div class="lbl">Isi</div><textarea id="pi" rows="4"></textarea><button class="btn wide" style="margin-top:12px" onclick="addP()">📢 Terbitkan</button></div>`+
  (D.Pengumuman||[]).slice().reverse().map(p=>`<div class="card"><div class="sm mut">${esc(p.Waktu)}</div><div class="b gold">${esc(p.Judul)}</div><div class="sm">${esc(p.Isi)}</div></div>`).join('')+`<p class="sm mut">Untuk menghapus/mengedit pengumuman, ubah langsung di tab Pengumuman Google Sheets.</p>`;
}
async function addP(){ const j=$('#pj').value.trim(),i=$('#pi').value.trim(); if(!j) return RC.toast('Judul wajib',true); await call({action:'addPengumuman',judul:j,isi:i},'📢 Terbit'); render(); }

reload();
</script>
</body>
